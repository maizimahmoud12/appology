<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgive Me ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Courier New", monospace;
}

body{
    background:#f7f7f7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    width:500px;
    max-width:90%;
    background:white;
    border:3px solid #b7c8ff;
    border-radius:15px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
}

h1{
    color:#2d3f7d;
    margin:20px 0;
    font-size:2rem;
}

.buttons{
    position:relative;
    height:120px;
}

button{
    border:none;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
    transition:.2s;
}

#yesBtn{
    background:#9ebcff;
    color:white;
}

#yesBtn:hover{
    transform:scale(1.05);
}

#noBtn{
    position:absolute;
    left:70px;
    top:20px;
    background:white;
    border:2px solid #9ebcff;
    color:#2d3f7d;
}

.hidden{
    display:none;
}

.message{
    margin-top:20px;
    line-height:1.7;
    color:#444;
    font-size:18px;
}

.restart{
    margin-top:25px;
    background:#9ebcff;
    color:white;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">

    <img src="/cat.jpg" alt="cat">

    <h1>Will you forgive me?</h1>

    <div class="buttons">
        <button id="noBtn">No</button>
        <button id="yesBtn">Yes</button>
    </div>

</div>

<!-- PAGE 2 -->
<div class="card hidden" id="page2">

    <img src="./cat2.jpg" alt="cat">

    <h1>I knew you would forgive me! 💙</h1>

    <div class="message">
        <p>
            I know I messed up, and I'm really sorry my aya.
        </p>

        <br>

        <p>
            Thank you for being patient with me and
            giving me another chance.
        </p>

        <br>

        <p>
            I promise to do better and make you smile
            every day. ❤️ 
            your mahmoud
        </p>
    </div>

    <button class="restart" onclick="restartPage()">
        Start Over
    </button>

</div>

<script>

const noBtn = document.getElementById("noBtn");

function moveButton(){

    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);
noBtn.addEventListener("touchstart", moveButton);

document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
});

function restartPage(){
    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page1").classList.remove("hidden");
}

</script>

</body>
</html>
